[build-system]
requires = [
  "setuptools>=77",
  "wheel"
]
build-backend = "setuptools.build_meta"


[project]
name = "botas"
version = "0.1.0"
description = "BOTAS: Bacterial Operon-aware Transcriptome Alignment System"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

authors = [
  { name = "Clabe Wekesa", email = "simiyu86wekesa@gmail.com" }
]

keywords = [
  "RNA-seq",
  "bacterial transcriptomics",
  "operons",
  "sequence alignment",
  "bioinformatics",
  "circular genomes"
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]

dependencies = [
  "pysam>=0.22",
  "edlib>=1.3.9",
  "biopython>=1.81"
]


[project.optional-dependencies]
progress = [
  "tqdm>=4.66"
]

dev = [
  "Cython>=3.0",
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "black>=24.0",
  "ruff>=0.5",
  "mypy>=1.8",
  "build>=1.2",
  "twine>=5.0"
]


[project.urls]
Homepage = "https://github.com/clabe-wekesa/botas"
Repository = "https://github.com/clabe-wekesa/botas"
Issues = "https://github.com/clabe-wekesa/botas/issues"
Documentation = "https://github.com/clabe-wekesa/botas#readme"


[project.scripts]
botas = "botas.cli.align:main"


# --------------------------------------------------
# Setuptools configuration
# --------------------------------------------------
[tool.setuptools]
include-package-data = true

ext-modules = [
  {
    name = "botas.quantify._core_fast",
    sources = ["botas/quantify/_core_fast.c"],
    optional = true
  }
]


# --------------------------------------------------
# Automatic package discovery
# --------------------------------------------------
[tool.setuptools.packages.find]
where = ["."]
include = ["botas*"]


# --------------------------------------------------
# Runtime package data
# --------------------------------------------------
[tool.setuptools.package-data]
"botas.data" = [
  "*.fa",
  "*.fasta",
  "*.fa.gz",
  "*.fasta.gz"
]


# --------------------------------------------------
# Pytest configuration
# --------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--import-mode=append"
